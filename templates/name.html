{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Введите имя</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        h1 {
            margin-bottom: 30px;
            color: #333;
        }
        input {
            padding: 12px 20px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 300px;
            text-align: center;
        }
        input:focus {
            outline: none;
            border-color: #4a90e2;
        }
        button {
            margin-top: 20px;
            padding: 12px 40px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #4a90e2;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #357ab8;
        }
        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 25px;
            background: #ccc;
            color: #333;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
        }
        .back-btn:hover {
            background: #b3b3b3;
        }
    </style>
</head>
<body>
    <h1>Какое твоё имя?</h1>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Введи имя" autofocus required>
        <br>
        <button type="submit">Показать</button>
    </form>
    <a href="{% url 'reset' %}" class="back-btn">← Назад</a>
</body>
</html>
